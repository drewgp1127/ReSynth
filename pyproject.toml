[project]
name = "resynth"
version = "0.1.0"
description = "ReSynth: turn a clip of a synth sound into a loadable Vital preset (prototype)."
requires-python = ">=3.11"
dependencies = [
    "vita==0.1.0",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "librosa>=0.11,<1.1",
    "cma>=4.0,<5",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27"]  # httpx: FastAPI test client
# basic-pitch itself is installed with --no-deps (its metadata demands tensorflow<2.15.1, which has
# no Python 3.12+/3.13 wheels); these are the deps it needs for its bundled ONNX model.
analysis = [
    "onnxruntime>=1.18,<2",
    "pretty-midi>=0.2.10",
    "mir-eval>=0.7",
    "resampy>=0.2.2,<0.4.3",
    "setuptools<81",  # resampy<0.4.3 imports pkg_resources
    "scikit-learn>=1.3",
]
# web app and Claude stages
web = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9"]
claude = ["anthropic>=2.8,<3"]
# install CPU-only torch first: pip install torch --index-url https://download.pytorch.org/whl/cpu
separation = ["audio-separator[cpu]==0.48.0", "audioread>=3.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -p no:cacheprovider"
markers = ["slow: long-running searches (run with -m slow)"]
filterwarnings = [
    "ignore:Could not import matplotlib:UserWarning",
]
